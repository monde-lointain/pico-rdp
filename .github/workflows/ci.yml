# 3-OS host CI for the RDP renderer.
#
# Cross-platform commitment: build + pass on
#   - Linux / clang      (Orthodoxy enforcement REQUIRED + canary check)
#   - Windows / MSVC
#   - macOS / AppleClang
#
# Host deps (SDL3, Dear ImGui, GoogleTest) come from FetchContent at configure
# time, so the runners need network access (default on GitHub-hosted runners).
#
# A separate `pico-build` job cross-compiles the renderer library (rdp_core) for
# the PicoSystem (arm-none-eabi / ILP32) so the device build can't silently
# regress: the renderer is a single C++ TU, and int/int32_t ABI mismatches only
# surface on ARM (host x86-64 has int32_t==int, so they compile there). It builds
# the library, not a .uf2, and runs no tests (no device in CI).
#
# NOTE: authored ahead of the GitHub remote existing; harmless until then.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang
            os: ubuntu-latest
            require_orthodoxy: "ON"
          - name: windows-msvc
            os: windows-latest
            require_orthodoxy: "OFF"
          - name: macos-appleclang
            os: macos-latest
            require_orthodoxy: "OFF"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- System build deps -------------------------------------------
      # SDL3 builds from source; on Linux it needs X11/Wayland dev headers.
      - name: Install SDL build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libegl1-mesa-dev libgles2-mesa-dev libdbus-1-dev libudev-dev \
            libpulse-dev ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # ---- LLVM/Clang dev libs + Orthodoxy plugin (Linux only) ---------
      # The Orthodoxy clang plugin must be COMPILED against matching LLVM/Clang
      # dev libraries (needs CMake >= 3.31 to build the plugin; the apt CMake on
      # ubuntu-latest is recent enough). Once installed, find_package(orthodoxy)
      # locates it and our RDP_REQUIRE_ORTHODOXY=ON assertion passes. See
      # docs/setup-llvm.md for the local equivalent.
      - name: Install LLVM/Clang dev + build Orthodoxy plugin (Linux)
        if: runner.os == 'Linux'
        env:
          LLVM_VERSION: "18"
          ORTHODOXY_URL: "https://github.com/d-musique/orthodoxy"
          ORTHODOXY_REF: "master"
        run: |
          set -euo pipefail
          # LLVM/Clang + dev headers (clang, llvm-config, libclang/llvm dev).
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_VERSION} \
            llvm-${LLVM_VERSION}-dev \
            libclang-${LLVM_VERSION}-dev \
            clang-tools-${LLVM_VERSION}
          # Build + install the Orthodoxy plugin against this LLVM/Clang.
          git clone --depth 1 --branch "${ORTHODOXY_REF}" \
            "${ORTHODOXY_URL}" "${RUNNER_TEMP}/orthodoxy"
          cmake -S "${RUNNER_TEMP}/orthodoxy" -B "${RUNNER_TEMP}/orthodoxy/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-${LLVM_VERSION} \
            -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION} \
            -DORTHODOXY_LLVM_CONFIG=/usr/bin/llvm-config-${LLVM_VERSION} \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "${RUNNER_TEMP}/orthodoxy/build"
          sudo cmake --build "${RUNNER_TEMP}/orthodoxy/build" --target install
          # Point the project's clang preset at this versioned clang.
          echo "RDP_CC=clang-${LLVM_VERSION}" >> "$GITHUB_ENV"
          echo "RDP_CXX=clang++-${LLVM_VERSION}" >> "$GITHUB_ENV"

      # ---- Configure ----------------------------------------------------
      # The `host` preset pins clang/clang++. On Windows/macOS we override the
      # compiler so the platform default toolchain (MSVC / AppleClang) is used.
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake --preset host
          -DCMAKE_C_COMPILER=${RDP_CC}
          -DCMAKE_CXX_COMPILER=${RDP_CXX}
          -DRDP_REQUIRE_ORTHODOXY=${{ matrix.require_orthodoxy }}

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake --preset host
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # Clear the preset's clang pin; let CMake pick the MSVC toolchain.
        run: >
          cmake --preset host
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl

      # ---- Build --------------------------------------------------------
      - name: Build
        run: cmake --build build-host --config Debug --parallel

      # ---- Test ---------------------------------------------------------
      # On Linux with the plugin live, the WILL_FAIL canary test proves
      # enforcement is active. Other OSes run the regular unit suite.
      - name: Test
        run: ctest --preset host --build-config Debug

  # ---- PicoSystem cross-compile (renderer lib only; no device, no tests) ----
  # Guards against ARM/ILP32-only C++ build regressions in the renderer TU.
  pico-build:
    name: pico-arm-rdp_core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm-none-eabi toolchain + build tools. libusb/pkg-config are needed
      # because configuring the pico preset builds picotool from source (the
      # SDK's pico_add_extra_outputs on the demo exe triggers it at configure).
      - name: Install ARM toolchain + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            cmake ninja-build git \
            libusb-1.0-0-dev pkg-config

      # pico-sdk (with submodules — pico_sdk_init pulls in tinyusb etc.).
      - name: Fetch pico-sdk
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-sdk.git "${RUNNER_TEMP}/pico-sdk"
          echo "PICO_SDK_PATH=${RUNNER_TEMP}/pico-sdk" >> "$GITHUB_ENV"

      # Configure the pico preset (PLATFORM=picosystem, Release) and build ONLY
      # the renderer library for ARM. That is the artifact that must not regress;
      # the demo .uf2 (template scaffold) is out of scope until sub-project 3.
      - name: Configure (pico preset)
        run: cmake --preset pico

      - name: Build rdp_core for ARM
        run: cmake --build build-pico --target rdp_core --parallel
